<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background-color: {{bg}}; background-image: radial-gradient(rgba(255,255,255,0.55) 2px, rgba(0,0,0,0) 2.5px); background-size: 26px 26px">
  <div style="position: absolute; left: {{left}}; top: {{top}}; width: {{w}}; height: {{h}}; transform: {{tf}}; transform-origin: 0 0">
    <sc-if value="{{phone}}" hint-placeholder-val="{{ true }}">
      <dc-import name="Mobile" seed="fresh" screen="title" persist="{{ true }}" hint-size="390px,844px"></dc-import>
    </sc-if>
    <sc-if value="{{wide}}" hint-placeholder-val="{{ false }}">
      <div style="width: 1440px; height: 900px"><dc-import name="Main" seed="fresh" screen="title" persist="{{ true }}" hint-size="1440px,900px"></dc-import></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
function size() {
  var vv = window.visualViewport;
  return { w: Math.round(vv ? vv.width : window.innerWidth), h: Math.round(vv ? vv.height : window.innerHeight) };
}
class Component extends DCLogic {
  constructor(props) { super(props); var s = size(); this.state = { vw: s.w, vh: s.h }; }
  componentDidMount() {
    var self = this;
    this.onResize = function () { var s = size(); if (s.w !== self.state.vw || s.h !== self.state.vh) self.setState({ vw: s.w, vh: s.h }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('orientationchange', function () { setTimeout(self.onResize, 250); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    var vw = this.state.vw, vh = this.state.vh;
    // Phones, and tablets held upright, get the phone layout. Laptops and tablets on their side get the desktop one.
    var phone = vw < 700 || (vh > vw && vw < 1000);
    var dw = phone ? 390 : 1440, dh = phone ? 844 : 900;
    var s = Math.min(vw / dw, vh / dh);
    if (phone && vw < 500) s = Math.min(vw / dw, vh / dh);
    var w = dw * s, h = dh * s;
    return {
      phone: phone, wide: !phone,
      w: dw + 'px', h: dh + 'px', tf: 'scale(' + s.toFixed(4) + ')',
      left: Math.round((vw - w) / 2) + 'px', top: Math.round((vh - h) / 2) + 'px',
      bg: '#D5E5F6'
    };
  }
}
</script>
