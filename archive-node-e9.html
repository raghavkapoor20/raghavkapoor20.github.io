<!DOCTYPE html>
<html lang="en" data-archive-font="departure">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive Node E-9</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  /* Departure Mono — monospaced pixel font by Helena Zhang, SIL OFL */
  @font-face {
    font-family: "DepartureMono";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2409-1@1.0/DepartureMono-Regular.woff2") format("woff2");
    font-weight: normal;
    font-display: swap;
  }

  :root {
    --bg: #0a0a0f;            /* cold near-black — set live by state memory */
    --ink: #c4c4d2;           /* softened cool off-white, not stark */
    --archive: #b89cf0;       /* electric purple, lifted to glow on dark — E-9 only */
    --tint: #16131f;          /* barely-there purple stain on the dark */
    --teal: #1fe6cb;          /* cold acknowledgement — appears then fades */
    --grid: rgba(184, 156, 240, 0.05);

    --font-narr: "Fragment Mono", ui-monospace, monospace;
    --font-archive: "DepartureMono", "Share Tech Mono", ui-monospace, monospace;
  }
  html[data-archive-font="sharetech"] {
    --font-archive: "Share Tech Mono", ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    transition: background 2.4s ease;
  }
  body {
    font-family: var(--font-narr);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #root { position: relative; height: 100%; }

  /* ---------- motion layer 1 : reactive sensor field ----------
     A perspective grid that parallax-shifts with the cursor, breathes, and
     lets a brighter pool of lines + a soft glow follow the pointer — E-9
     tracking where you are rather than a static checked pattern. */
  .field { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    --mx: .5; --my: .46; --px: 0px; --py: 0px; }

  .field-grid {
    position: absolute; inset: -12%;
    background-image:
      linear-gradient(rgba(150,160,200,0.9) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150,160,200,0.9) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: translate(var(--px), var(--py)) scale(1);
    transform-origin: 50% 42%;
    will-change: transform, opacity;
  }
  /* faint everywhere, breathing on its own */
  .field-grid--base {
    opacity: .022;
    animation: breathe 8s ease-in-out infinite;
  }
  /* brighter lines, revealed only in a pool around the cursor */
  .field-grid--pool {
    opacity: .06;
    transform: translate(calc(var(--px) * 1.7), calc(var(--py) * 1.7));
    -webkit-mask-image: radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),
        rgba(0,0,0,.9) 0%, rgba(0,0,0,.35) 16%, transparent 34%);
    mask-image: radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),
        rgba(0,0,0,.9) 0%, rgba(0,0,0,.35) 16%, transparent 34%);
  }
  /* soft purple sensor glow that follows the pointer */
  .field-glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),
        rgba(157,127,212,.06) 0%, rgba(157,127,212,.025) 20%, transparent 42%);
    transition: background .12s linear;
  }
  .field-fade {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 78% 74% at 50% 45%, transparent 40%, var(--bg) 90%);
    transition: background 2.4s ease;
  }
  @keyframes breathe {
    0%, 100% { opacity: .035; }
    50%      { opacity: .06; }
  }

  /* ---------- motion layer 2 : scan-line / sensor sweep ---------- */
  .scan-sweep {
    position: fixed; left: 0; right: 0; height: 1px;
    background: var(--archive);
    opacity: 0; pointer-events: none; z-index: 1;
    animation: sweep 13.5s linear infinite;
  }
  @keyframes sweep {
    0%   { top: -2%;  opacity: 0; }
    2%   { opacity: .05; }
    20%  { top: 102%; opacity: .05; }
    21%  { opacity: 0; }
    100% { top: 102%; opacity: 0; }
  }

  /* ---------- motion layer 3 : alien glyphs in the margins ---------- */
  .margin-glyphs { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .margin-glyph {
    position: fixed;
    font-family: var(--font-archive);
    font-size: 13px;
    color: var(--archive);
    opacity: .12;
    animation: glyphPulse 6s ease-in-out infinite;
  }
  @keyframes glyphPulse {
    0%, 100% { opacity: .05; }
    50%      { opacity: .18; }
  }

  /* ---------- stage / conversation column ---------- */
  .stage {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 9vh 24px;
    overflow-y: auto;
  }
  .column {
    width: 100%;
    max-width: 640px;
    position: relative;
  }

  .passage { }

  .narration {
    display: block;
    font-family: var(--font-narr);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.8;
    letter-spacing: .01em;
    min-height: 1.8em;
    text-shadow: 0 1px 8px rgba(7,8,12,0.85);
  }

  .archive {
    display: block;
    font-family: var(--font-archive);
    color: var(--archive);
    font-size: 17px;
    line-height: 1.85;
    letter-spacing: .005em;
    text-shadow: 0 1px 8px rgba(7,8,12,0.85);
  }

  /* ---------- archive glow : light pouring from the top while E-9 speaks ---------- */
  .aurora {
    position: fixed;
    top: -10vh;
    left: -8%;
    width: 116%;
    height: 54vh;
    z-index: 1;            /* above the grid, behind the text */
    pointer-events: none;
    filter: blur(38px) saturate(1.4);
    will-change: opacity;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  .aurora.is-live { opacity: .78; }
  /* dependable base glow — hue-varied light pouring from above */
  .aurora-base {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(54% 46% at 8% -18%, rgba(160,95,245,0.62), transparent 58%),
      radial-gradient(48% 44% at 30% -16%, rgba(100,120,250,0.58), transparent 58%),
      radial-gradient(52% 48% at 52% -16%, rgba(0,220,210,0.52), transparent 58%),
      radial-gradient(48% 44% at 74% -16%, rgba(140,90,245,0.56), transparent 58%),
      radial-gradient(54% 46% at 96% -18%, rgba(215,100,215,0.56), transparent 58%);
    animation: auroraBreath 6.5s ease-in-out infinite;
    mix-blend-mode: screen;
  }
  @keyframes auroraBreath {
    0%, 100% { opacity: .72; transform: translateY(-2%) scale(1.0); }
    50%      { opacity: 1;   transform: translateY(2%)  scale(1.06); }
  }
  .aurora-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    mix-blend-mode: screen;
  }

  /* ---------- dividers ---------- */
  .divider { height: 1px; border: 0; }
  .divider--soft { margin: 26px 0; background: transparent; }
  .divider--rule {
    margin: 30px 0 26px;
    background: var(--archive);
    opacity: .20;
    animation: ruleIn .9s ease forwards;
    transform-origin: left;
  }
  @keyframes ruleIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---------- choices : no buttons, just words you are allowed to say ---------- */
  .choices { display: flex; flex-direction: column; gap: 4px; }
  .choice {
    position: relative;
    appearance: none; background: none; border: 0; cursor: pointer;
    text-align: left;
    font-family: var(--font-narr);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.7;
    padding: 11px 14px 11px 20px;
    text-shadow: 0 1px 8px rgba(7,8,12,0.8);
    transition: color .35s ease, background .4s ease, opacity .55s ease,
                transform .55s ease, padding-left .4s cubic-bezier(.5,0,.2,1);
    opacity: 0;
    transform: translateY(5px);
  }
  .choice.is-in { opacity: 1; transform: translateY(0); }

  /* the left bar : a glowing purple→cyan transmission line E-9 draws as it
     registers that you are considering this option */
  .choice-bar {
    position: absolute; left: 0; top: 8%; bottom: 8%; width: 2px;
    background: linear-gradient(180deg, var(--archive), var(--teal));
    transform: scaleY(0); transform-origin: top;
    transition: transform .42s cubic-bezier(.5, 0, .2, 1), box-shadow .4s ease;
  }
  .choice-bar.is-drawn,
  .choice:hover .choice-bar { transform: scaleY(1); }
  .choice:hover .choice-bar {
    box-shadow: 0 0 8px rgba(184,156,240,.65), 0 0 16px rgba(31,230,203,.4);
  }

  /* a single light-sweep across the option on hover — E-9 scanning your words */
  .choice::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      transparent 0%,
      rgba(184,156,240,.10) 38%,
      rgba(120,180,240,.16) 50%,
      rgba(31,230,203,.10) 62%,
      transparent 100%);
    background-size: 55% 100%;
    background-repeat: no-repeat;
    background-position: -70% 0;
    opacity: 0;
    pointer-events: none;
  }
  .choice:hover::after { animation: choiceScan 1.05s ease forwards; }
  @keyframes choiceScan {
    0%   { background-position: -70% 0; opacity: 0; }
    18%  { opacity: 1; }
    100% { background-position: 170% 0; opacity: 0; }
  }

  .choice:hover {
    color: #dcd6f7;
    padding-left: 27px;
    text-shadow: 0 0 10px rgba(184,156,240,.55), 0 0 20px rgba(31,230,203,.28), 0 1px 8px rgba(7,8,12,0.8);
    background: linear-gradient(90deg,
      rgba(184,156,240,.085) 0%,
      rgba(120,180,240,.045) 42%,
      rgba(31,230,203,.02) 70%,
      transparent 100%);
  }
  html[style*="--bg"] .choice:hover {
    background: linear-gradient(90deg,
      rgba(184,156,240,.085) 0%,
      rgba(120,180,240,.045) 42%,
      rgba(31,230,203,.02) 70%,
      transparent 100%);
  }
  .choice-text { position: relative; z-index: 1; }

  .choice--confirmed { color: var(--teal); background: transparent; }
  .choice--confirmed .choice-bar {
    background: linear-gradient(180deg, var(--archive), var(--teal));
    transform: scaleY(1);
    box-shadow: 0 0 10px rgba(31,230,203,.6);
  }
  .choice--dimmed { opacity: .22; pointer-events: none; }

  /* ---------- calibration ---------- */
  .calibration { cursor: pointer; user-select: none; }
  .calib-stack { display: flex; flex-direction: column; gap: 14px; min-height: 40vh; justify-content: center; }
  .calib-line {
    font-family: var(--font-archive);
    color: var(--archive);
    opacity: .55;
    font-size: 16px;
    letter-spacing: .12em;
    animation: calibLineIn .5s ease both;
  }
  @keyframes calibLineIn { from { opacity: 0; } to { opacity: .55; } }
  .calib-resolved {
    font-size: 18px;
    letter-spacing: .02em;
    text-shadow: 0 1px 8px rgba(7,8,12,0.85);
  }
  .calib-hint {
    margin-top: 40px;
    font-family: var(--font-narr);
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--ink);
    opacity: .28;
    text-transform: uppercase;
  }

  /* ---------- progress readout ---------- */
  .readout {
    position: fixed; top: 22px; right: 26px; z-index: 5;
    font-family: var(--font-archive);
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--archive);
    opacity: .6;
    user-select: none;
  }
  .readout .ro-key { opacity: .7; }
  .readout .ro-sep { opacity: .4; }

  /* ---------- corner signature ---------- */
  .sig {
    position: fixed; bottom: 20px; left: 26px; z-index: 5;
    font-family: var(--font-archive);
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--archive);
    opacity: .28;
    user-select: none;
  }

  @media (max-width: 520px) {
    .readout { font-size: 10px; top: 14px; right: 14px; }
    .sig { display: none; }
    .narration { font-size: 15px; }
    .archive { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-grid, .scan-sweep, .margin-glyph { animation: none; }
  }
</style>
</head>

  const ref = React.useRef(null);

    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5); // blurred anyway
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let W = 0, H = 0;
    const resize = () => {
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(canvas);

    // vivid light sources strung along the top edge

      [150, 90, 235],  // electric purple
      [110, 90, 240],  // indigo
      [70, 120, 245],  // blue
      [0, 200, 210],   // cyan
      [0, 210, 175],   // teal
      [120, 80, 235],  // violet
      [200, 95, 205],  // magenta
      [80, 160, 240],  // sky
    ];
    const N = 8;
    const t0 = performance.now();
    let raf;
    let glitchUntil = 0, glitchDx = 0, nextGlitch = 1800 + Math.random() * 2600;

    const draw = (now) => {
      const t = (now - t0) / 1000;
      const on = activeRef.current;

      // ease energy (slow surge in, slower recede)
      eRef.current += ((on ? 1 : 0) - eRef.current) * (on ? 0.05 : 0.03);
      const e = eRef.current;

      // syllabic envelope — the light pulses in waves as E-9 forms words
      let env = 0.5 + 0.5 * Math.sin(t * 5.0);
      env *= 0.55 + 0.45 * Math.sin(t * 2.3 + 0.7);

      const flick = reduce
        ? 1

      if (now - t0 >= nextGlitch) {
        glitchUntil = now + 90 + Math.random() * 170;
        glitchDx = 5 + Math.random() * 14;
        nextGlitch = (now - t0) + 1400 + Math.random() * 3800;

      ctx.globalCompositeOperation = "source-over";

      // luminous gradient curtain at the very top — rich hue sweep across width
      const band = ctx.createLinearGradient(0, 0, W, 0);
      const ba = 0.30 * e * flick;
      band.addColorStop(0.00, "rgba(150,90,235," + ba + ")");
      band.addColorStop(0.30, "rgba(80,120,245," + ba + ")");
      band.addColorStop(0.55, "rgba(0,205,195," + ba + ")");
      band.addColorStop(0.78, "rgba(130,85,235," + ba + ")");
      band.addColorStop(1.00, "rgba(200,95,205," + ba + ")");
      const bandFade = ctx.createLinearGradient(0, 0, 0, H * 0.82);
      ctx.save();
      ctx.fillStyle = band;
      ctx.fillRect(0, 0, W, H * 0.82);
      // taper the curtain vertically (strong at top, reaching well down)
      ctx.globalCompositeOperation = "destination-out";
      bandFade.addColorStop(0, "rgba(0,0,0,0)");
      bandFade.addColorStop(1, "rgba(0,0,0,1)");
      ctx.fillStyle = bandFade;
      ctx.fillRect(0, 0, W, H * 0.82);
      ctx.restore();

      // individual drifting light sources hanging off the top edge.
      // ADDITIVE compositing so overlapping lights pile into brilliant cores.
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < N; i++) {
        const col = palette[i % palette.length];
        const col2 = palette[(i + 3) % palette.length]; // second hue for gradient
        const phase = i * 1.7;
        const x = ((i + 0.5) / N) * W + Math.sin(t * 0.5 + phase) * W * 0.13;
        const y = H * 0.09 + Math.sin(t * 0.7 + phase) * H * 0.06; // hang into view
        const pulse = 0.5 + 0.5 * Math.sin(t * 1.5 + phase) * renv;
        const R = Math.max(W, H) * (0.66 + 0.28 * e) * (0.84 + 0.5 * pulse);
        const a = 0.55 * e * (0.55 + 0.45 * renv) * flick;
        const dx = glitching ? (i % 2 ? glitchDx : -glitchDx) : 0;

        const g = ctx.createRadialGradient(x + dx, y, 0, x + dx, y, R);
        g.addColorStop(0.0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + a + ")");
        g.addColorStop(0.32, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (a * 0.62) + ")");
        g.addColorStop(0.66, "rgba(" + col2[0] + "," + col2[1] + "," + col2[2] + "," + (a * 0.30) + ")");
        g.addColorStop(1.0, "rgba(" + col2[0] + "," + col2[1] + "," + col2[2] + ",0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x + dx, y, R, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // rare bright "ripple" sweeping down when a fresh burst of speech lands
      const ripple = (Math.sin(t * 1.1) * 0.5 + 0.5);
      if (e > 0.4) {
        const ry = H * (0.04 + 0.5 * ripple);
        const rg = ctx.createLinearGradient(0, ry - H * 0.12, 0, ry + H * 0.12);
        rg.addColorStop(0, "rgba(150,170,235,0)");
        rg.addColorStop(0.5, "rgba(150,170,235," + (0.06 * e * renv * flick) + ")");
        rg.addColorStop(1, "rgba(150,170,235,0)");
        ctx.fillStyle = rg;
        ctx.fillRect(0, ry - H * 0.12, W, H * 0.24);
      }

      // fade the whole field out toward the bottom — light is strongest up top
      ctx.globalCompositeOperation = "destination-out";
      const fade = ctx.createLinearGradient(0, 0, 0, H);
      fade.addColorStop(0.0, "rgba(0,0,0,0)");
      fade.addColorStop(0.72, "rgba(0,0,0,0)");
      fade.addColorStop(1.0, "rgba(0,0,0,1)");
      ctx.fillStyle = fade;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";

      // subtle glitch jitter on the whole layer (CSS .is-live controls fade)
      if (canvas) {
        const jx = glitching ? (Math.random() - 0.5) * 7 : 0;
        canvas.style.transform = "translateX(" + jx.toFixed(1) + "px)";
      }

      raf = requestAnimationFrame(draw);
    };

    raf = requestAnimationFrame(draw);
    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
    };
  }, []);

  return (
    <div className={"aurora" + (active ? " is-live" : "")} ref={wrapRef} aria-hidden="true">
      <div className="aurora-base"></div>
      <canvas ref={ref} className="aurora-canvas"></canvas>
    </div>
  );
}

Object.assign(window, { ArchiveGlow, OrbVisualizer: ArchiveGlow });

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>
  <!-- inlined from app.jsx (see that file for the editable source; kept in sync) -->
  <script type="text/babel">
/* ============================================================================
   ARCHIVE NODE E-9  ·  APP
   The interface is the AI. Calibration → conversation. Your choices are the
   only words you are allowed to say. E-9 decides what to tell you next.
   ========================================================================== */

const { useState, useEffect, useRef, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "speed": 1.25,
  "glyphIntensity": 0.85,
  "scanline": true,
  "grid": true,
  "archiveFont": "departure"
}/*EDITMODE-END*/;

/* ---- state memory : the room's white shifts with the path you take -------- */
function warmthToBg(w) {
  const t = Math.max(-3, Math.min(3, w)) / 3; // -1 (cold) .. +1 (warm)
  const base = [10, 10, 15];
  const cold = [8, 11, 22];   // fractionally bluer/colder
  const warm = [17, 12, 13];  // fractionally warmer
  const target = t < 0 ? cold : warm;
  const k = Math.abs(t);
  const mix = base.map((b, i) => Math.round(b + (target[i] - b) * k));
  return `rgb(${mix[0]}, ${mix[1]}, ${mix[2]})`;
}

/* ---- progress readout : NODE: E-9 // DEPTH: 03 // ACCESS: PARTIAL --------- */
function ProgressReadout({ depth, access }) {
  const d = String(depth).padStart(2, "0");
  return (
    <div className="readout" aria-label="node status">
      <span className="ro-key">NODE:</span>&nbsp;E-9
      <span className="ro-sep">&nbsp;//&nbsp;</span>
      <span className="ro-key">DEPTH:</span>&nbsp;
      <AssembledText key={"d" + depth} text={d} cps={26} glyphIntensity={1} />
      <span className="ro-sep">&nbsp;//&nbsp;</span>
      <span className="ro-key">ACCESS:</span>&nbsp;
      <AssembledText key={"a" + access} text={access} cps={26} glyphIntensity={1} />
    </div>
  );
}

/* ---- a single choice : plain text, purple border draws in on hover -------- */
function Choice({ choice, index, disabled, confirmed, onPick }) {
  const [hover, setHover] = useState(false);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const id = setTimeout(() => setShown(true), 30 + index * 130);
    return () => clearTimeout(id);
  }, [index]);
  return (
    <button
      type="button"
      className={
        "choice" +
        (shown ? " is-in" : "") +
        (confirmed ? " choice--confirmed" : "") +
        (disabled && !confirmed ? " choice--dimmed" : "")
      }
      disabled={disabled}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      onClick={() => onPick(choice)}
    >
      <span className={"choice-bar" + (hover || confirmed ? " is-drawn" : "")}></span>
      <span className="choice-text">{choice.text}</span>
    </button>
  );
}

/* ---- one exchange : narration → divider → archive → divider → choices ----- */
function Passage({ node, glyphIntensity, speed, onChoose, onSpeaking }) {
  const [stage, setStage] = useState(0); // 0 narr, 1 archive, 2 choices
  const [picked, setPicked] = useState(null);

  // E-9 (purple) is "speaking" only while the archive line is assembling
  useEffect(() => {
    onSpeaking && onSpeaking(stage === 1);
  }, [stage]);
  useEffect(() => () => { onSpeaking && onSpeaking(false); }, []);

  useEffect(() => {
    setStage(0);
    setPicked(null);
  }, [node.__id]);

  const archiveText = (node.archive || "").split(" // ").join("\n");

  const pick = (choice) => {
    if (picked) return;
    setPicked(choice);
    // teal acknowledgement, then advance
    setTimeout(() => onChoose(choice), 720);
  };

  return (
    <div className="passage" key={node.__id}>
      <AssembledText
        key={node.__id + "-n"}
        text={node.narration}
        cps={48 * speed}
        glyphIntensity={glyphIntensity}
        className="narration"
        onDone={() => setStage((s) => Math.max(s, 1))}
      />

      {stage >= 1 && <div className="divider divider--soft"></div>}

      {stage >= 1 && (
        <AssembledText
          key={node.__id + "-a"}
          text={archiveText}
          cps={12.5 * speed}
          halting={true}
          glyphIntensity={glyphIntensity}
          className="archive"
          onDone={() => setStage((s) => Math.max(s, 2))}
        />
      )}

      {stage >= 2 && <div className="divider divider--rule"></div>}

      {stage >= 2 && (
        <div className="choices">
          {node.choices.map((c, i) => (
            <Choice
              key={i}
              index={i}
              choice={c}
              disabled={!!picked}
              confirmed={picked === c}
              onPick={pick}
            />
          ))}
        </div>
      )}
    </div>
  );
}

/* ---- calibration boot : alien scripts cycle, then English resolves -------- */
function Calibration({ speed, onComplete, onSpeaking }) {
  const scripts = window.E9_CALIBRATION_SCRIPTS;
  const [visible, setVisible] = useState(0); // how many alien lines shown
  const [resolved, setResolved] = useState(false);
  const [skipped, setSkipped] = useState(false);

  useEffect(() => {
    const timers = [];
    const step = 620 / speed;
    for (let i = 1; i <= scripts.length; i++) {
      timers.push(setTimeout(() => setVisible(i), step * i));
    }
    timers.push(setTimeout(() => setResolved(true), step * scripts.length + 900 / speed));
    return () => timers.forEach(clearTimeout);
  }, []);

  const finish = useCallback(() => onComplete && onComplete(), [onComplete]);
  const [lineDone, setLineDone] = useState(false);

  // E-9 is "speaking" while the resolved first line assembles
  useEffect(() => {
    onSpeaking && onSpeaking(resolved && !lineDone);
  }, [resolved, lineDone]);
  useEffect(() => () => { onSpeaking && onSpeaking(false); }, []);

  const doSkip = () => {
    if (skipped) return;
    setSkipped(true);
    setResolved(true);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === " " || e.key === "Enter") doSkip();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  return (
    <div className="calibration" onClick={doSkip}>
      <div className="calib-stack">
        {!resolved &&
          scripts.slice(0, visible).map((s, i) => (
            <ScrambleLine key={i} seed={s} className="calib-line" />
          ))}
        {resolved && (
          <AssembledText
            key="firstline"
            text={window.E9_FIRST_LINE}
            cps={11 * speed}
            halting={true}
            glyphIntensity={0.95}
            className="archive calib-resolved"
            onDone={() => {
              setLineDone(true);
              setTimeout(finish, 1100 / speed);
            }}
          />
        )}
      </div>
      {!resolved && <div className="calib-hint">— click to skip calibration —</div>}
    </div>
  );
}

/* ---- root ---------------------------------------------------------------- */
function App() {
  const saved = (() => {
    try {
      return JSON.parse(localStorage.getItem("e9_state") || "null");
    } catch (e) {
      return null;
    }
  })();

  const [phase, setPhase] = useState(saved && saved.node ? "passage" : "calibration");
  const [nodeId, setNodeId] = useState((saved && saved.node) || window.E9_START);
  const [warmth, setWarmth] = useState((saved && saved.warmth) || 0);
  const [stamp, setStamp] = useState(0); // forces Passage remount on revisit
  const [speaking, setSpeaking] = useState(false); // drives the fixed orb

  // ------- Tweaks (toggle from the toolbar) -------
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const speed = t.speed;
  const glyphIntensity = t.glyphIntensity;
  const scanline = t.scanline;
  const grid = t.grid;
  const archiveFont = t.archiveFont;

  // apply state-memory white + archive font to the document
  useEffect(() => {
    document.documentElement.style.setProperty("--bg", warmthToBg(warmth));
  }, [warmth]);
  useEffect(() => {
    document.documentElement.setAttribute("data-archive-font", archiveFont);
  }, [archiveFont]);

  // persist place so a refresh doesn't lose progress
  useEffect(() => {
    if (phase === "passage") {
      localStorage.setItem("e9_state", JSON.stringify({ node: nodeId, warmth }));
    }
  }, [phase, nodeId, warmth]);

  const node = { ...window.E9_STORY[nodeId], __id: nodeId + "#" + stamp };

  const handleChoose = (choice) => {
    if (choice.to === "__restart") {
      localStorage.removeItem("e9_state");
      setWarmth(0);
      setNodeId(window.E9_START);
      setStamp((s) => s + 1);
      setPhase("calibration");
      return;
    }
    setWarmth((w) => w + (choice.drift === "warm" ? 1 : choice.drift === "cold" ? -1 : 0));
    setNodeId(choice.to);
    setStamp((s) => s + 1);
  };

  return (
    <React.Fragment>
      <BackgroundLayers scanline={scanline} grid={grid} />
      <ArchiveGlow active={speaking} />
      <ProgressReadout depth={node.depth} access={node.access} />

      <main className="stage">
        <div className="column">
          {phase === "calibration" ? (
            <Calibration
              speed={speed}
              onComplete={() => setPhase("passage")}
              onSpeaking={setSpeaking}
            />
          ) : (
            <Passage
              node={node}
              speed={speed}
              glyphIntensity={glyphIntensity}
              onChoose={handleChoose}
              onSpeaking={setSpeaking}
            />
          )}
        </div>
      </main>

      <div className="sig" aria-hidden="true">ARCHIVE NODE E-9</div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="E-9's cadence" />
        <TweakSlider
          label="Speech speed"
          value={speed}
          min={0.6}
          max={2.2}
          step={0.05}
          onChange={(v) => setTweak("speed", v)}
        />
        <TweakSlider
          label="Wrongness"
          value={glyphIntensity}
          min={0}
          max={1}
          step={0.05}
          onChange={(v) => setTweak("glyphIntensity", v)}
        />
        <TweakRadio
          label="Archive typeface"
          value={archiveFont}
          options={["departure", "sharetech"]}
          onChange={(v) => setTweak("archiveFont", v)}
        />
        <TweakSection label="The room" />
        <TweakToggle
          label="Breathing grid"
          value={grid}
          onChange={(v) => setTweak("grid", v)}
        />
        <TweakToggle
          label="Sensor sweep"
          value={scanline}
          onChange={(v) => setTweak("scanline", v)}
        />
        <TweakButton
          label="Wipe memory + recalibrate"
          onClick={() => {
            localStorage.removeItem("e9_state");
            setWarmth(0);
            setNodeId(window.E9_START);
            setStamp((s) => s + 1);
            setPhase("calibration");
          }}
        />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
